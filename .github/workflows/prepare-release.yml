name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact v-prefixed semantic version requested by Garden
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Validate requested version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "Prepare release must run from a branch" >&2
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Garden version must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$VERSION" || \
             git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Create release commit and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          npm version "${VERSION#v}" --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: prepare release $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"
          # The version commit intentionally remains tag-only. Garden derives the
          # next version from tag history, and the protected branch stays unchanged.
          git push origin "refs/tags/$VERSION"

      - name: Dispatch publisher for the exact tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh workflow run publish.yml --ref "$VERSION"
